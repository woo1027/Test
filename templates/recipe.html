<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>標準成本｜便當店營運管理系統</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
<header class="topbar">
  <div class="brand">🍱 便當店營運管理</div>
  <nav>
    <a href="/">每日紀錄</a>
    <a href="/report">月報表</a>
    <a href="/staff">人事設定</a>
    <a class="active" href="/recipe">標準成本</a>
    <a href="/settings">設定</a>
  </nav>
</header>

<main class="container">
  <section class="card">
    <h2>食材與包材單價</h2>
    <p class="hint">用來算出每個便當的標準成本。單價要換算成配方使用的單位（克/顆/片/個），不是進貨採購時的包裝單位。「包材」類（碗、蓋子）會拿去跟「包材/餐盒容器」項目的實際花費比對，不會算進食材成本。</p>
    <table class="data-table">
      <thead><tr><th>項目</th><th>類別</th><th>單位</th><th>單價</th><th></th></tr></thead>
      <tbody id="ingredient-list"></tbody>
    </table>
  </section>

  <section class="card">
    <h2>便當售價與毛利</h2>
    <p class="hint">毛利＝售價－標準成本，只看得出食材+包材的成本，人事、租金等其他費用沒有算進去，不是最終淨利。</p>
    <table class="data-table">
      <thead><tr><th>品項</th><th>標準成本</th><th>售價</th><th>毛利</th><th>毛利率</th><th></th></tr></thead>
      <tbody id="bento-margin-list"></tbody>
    </table>
  </section>

  <section class="card">
    <h2>便當配方與標準成本</h2>
    <p class="hint">每個便當用到的食材與包材，系統會自動用上面的單價算出標準成本。醬汁、水、油等低金額隱形成本未列入。</p>
    <div id="bento-list"></div>
  </section>
</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>
<script>initRecipePage();</script>
</body>
</html>
