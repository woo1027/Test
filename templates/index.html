<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>每日紀錄｜便當店營運管理系統</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
<header class="topbar">
  <div class="brand">🍱 便當店營運管理</div>
  <nav>
    <a class="active" href="/">每日紀錄</a>
    <a href="/report">月報表</a>
    <a href="/staff">人事設定</a>
    <a href="/recipe">標準成本</a>
    <a href="/settings">設定</a>
  </nav>
</header>

<main class="container">
  <section class="card">
    <h2>今日 / 指定日期紀錄</h2>
    <div class="field-row">
      <label>日期
        <input type="date" id="record-date" value="{{ today }}" />
      </label>
    </div>

    <div class="field-row">
      <label>當日營業額
        <input type="number" id="revenue-input" min="0" step="1" placeholder="輸入營業額" />
      </label>
      <button id="save-revenue-btn">儲存營業額</button>
    </div>

    <h3>新增成本紀錄</h3>
    <div class="field-row">
      <label>成本項目
        <select id="cost-category"></select>
      </label>
      <label>金額
        <input type="number" id="cost-amount" min="0" step="1" placeholder="金額" />
      </label>
      <label>備註
        <input type="text" id="cost-note" placeholder="選填" />
      </label>
      <button id="add-cost-btn">新增</button>
    </div>

    <table class="data-table">
      <thead>
        <tr><th>項目</th><th>金額</th><th>備註</th><th></th></tr>
      </thead>
      <tbody id="cost-list"></tbody>
      <tfoot>
        <tr><td>當日成本合計</td><td id="cost-total">0</td><td colspan="2"></td></tr>
      </tfoot>
    </table>
  </section>

  <section class="card">
    <h2>各品項當日賣出數量</h2>
    <p class="hint">用來計算標準食材成本，跟實際採購金額比對用，可以到「標準成本」頁面看比較結果。</p>
    <table class="data-table">
      <thead>
        <tr><th>品項</th><th>賣出數量</th><th></th></tr>
      </thead>
      <tbody id="bento-sales-list"></tbody>
    </table>
  </section>

  <section class="card">
    <h2>計時人員當日工時</h2>
    <p class="hint">正職人員薪資已在「人事設定」登記，月報表會自動計算，不需要在這裡填寫。</p>
    <table class="data-table">
      <thead>
        <tr><th>姓名</th><th>時薪</th><th>當日時數</th><th></th></tr>
      </thead>
      <tbody id="hours-list"></tbody>
    </table>
  </section>

  <section class="card">
    <h2>最近 14 天概況</h2>
    <table class="data-table">
      <thead>
        <tr><th>日期</th><th>營業額</th><th>成本</th><th>毛利</th></tr>
      </thead>
      <tbody id="recent-list"></tbody>
    </table>
  </section>
</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>
<script>initDailyPage();</script>
</body>
</html>
